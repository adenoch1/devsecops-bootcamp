name: Rotate application secret

on:
  schedule:
    - cron: "23 5 1 */3 *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_APPLY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Rotate SecureString without exposing it
        shell: bash
        env:
          PARAMETER_NAME: ${{ secrets.FLASK_SECRET_PARAMETER_NAME }}
        run: |
          set -euo pipefail
          test -n "$PARAMETER_NAME"
          NEW_VALUE="$(openssl rand -base64 64)"
          aws ssm put-parameter \
            --name "$PARAMETER_NAME" \
            --type SecureString \
            --key-id "${{ secrets.SECRETS_KMS_KEY_ARN }}" \
            --value "$NEW_VALUE" \
            --overwrite >/dev/null
          unset NEW_VALUE
      - name: Trigger controlled production redeployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run terraform-release.yml -f action=deploy -f environment=production
