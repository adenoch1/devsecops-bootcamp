name: Quarterly disaster recovery exercise

on:
  schedule:
    - cron: "11 6 1 */3 *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    environment: disaster-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DR_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Verify replicated recovery data
        env:
          DR_LOG_BUCKET: ${{ secrets.DR_LOG_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$DR_LOG_BUCKET"
          aws s3api head-bucket --bucket "$DR_LOG_BUCKET"
          aws s3api list-objects-v2 --bucket "$DR_LOG_BUCKET" --max-items 1 > /tmp/dr-objects.json
          test "$(jq '.KeyCount' /tmp/dr-objects.json)" -gt 0
      - name: Validate recovery infrastructure
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false
          terraform validate
          terraform plan -refresh=false -lock=false \
            -var-file=config/production.tfvars \
            -var="aws_region=${{ secrets.AWS_DR_REGION }}" \
            -var="replication_region=${{ secrets.AWS_REGION }}" \
            -var="acm_certificate_arn=${{ secrets.AWS_DR_ACM_CERTIFICATE_ARN }}" \
            -var="terraform_role_name=${{ secrets.AWS_DR_TERRAFORM_ROLE_NAME }}" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -out=/tmp/dr-restore.tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: dr-restore-plan-${{ github.run_id }}
          path: /tmp/dr-restore.tfplan
          retention-days: 365
